<!DOCTYPE html>
<html>
<head>
  <title>domain.get</title>
</head>
<body>
  <div class="page">
    <h1>Domain Kaydı</h1>
    <p>Kendi sitenizi Sky Web'e kaydedin.</p>

    <div class="row">
      <p class="label">Domain</p>
      <input id="domain" placeholder="örnek" />
    </div>

    <div class="row">
      <p class="label">TLD</p>
      <input id="tld" placeholder="site" />
    </div>

    <div class="row">
      <p class="label">Repo</p>
      <input id="repo" placeholder="kullanıcı/repo veya kullanıcı/repo/klasör" />
    </div>

    <button onclick="submit">Kaydet</button>

    <p id="status" class="status">Bilgileri girip Kaydet'e basın.</p>
  </div>
</body>
</html>
